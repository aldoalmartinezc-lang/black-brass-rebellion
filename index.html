<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK: Brass Rebellion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #gameCanvas { display: block; background: #000; border: 1px solid #1a1a0a; }
    #mobileControls { display: flex; gap: 16px; margin-top: 12px; }
    .ctrl-btn { background: #0a0a00; color: #c8a84b; border: 1px solid #c8a84b; padding: 12px 24px; font-family: 'Courier New', monospace; font-size: 14px; cursor: pointer; border-radius: 4px; user-select: none; touch-action: manipulation; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="560" height="460"></canvas>
  <div id="mobileControls">
    <button class="ctrl-btn" id="btnLeft">&#9664;</button>
    <button class="ctrl-btn" id="btnFire">FIRE</button>
    <button class="ctrl-btn" id="btnRight">&#9654;</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
